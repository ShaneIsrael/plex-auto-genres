services:
  plex-auto-genres:
    container_name: plex-auto-genres
    image: ghcr.io/dim145/plex-auto-genres:latest
    restart: unless-stopped
    volumes:
      - ./config:/config     # must contain config.json
      - ./logs:/logs         # state database and run history
      - ./posters:/posters   # optional, only needed for setPosters
    environment:
      # --- Plex (token auth is preferred; see the README for how to find it)
      PLEX_BASE_URL: "http://192.168.1.10:32400"
      PLEX_TOKEN: "${PLEX_TOKEN:?set PLEX_TOKEN in a .env file next to this compose file}"
      PLEX_COLLECTION_PREFIX: ""
      # --- Metadata providers
      TMDB_API_KEY: "${TMDB_API_KEY:-}"   # not needed for anime-only setups
      # --- Scheduling
      CRON_SCHEDULE: "0 1 * * *"
      RUN_ON_START: "true"
      TZ: "Europe/Paris"
      # --- Tuning
      PAG_CONCURRENCY: "4"
    # The image already runs as uid 1000; override if your volumes differ.
    # user: "1000:1000"

# Secrets note: putting PLEX_TOKEN directly in this file means it lands in
# `docker inspect` and your shell history. Prefer a .env file beside the
# compose file (git-ignored), or Docker secrets on Swarm.
